<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Dental - Contacto</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>

  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="material-symbols-outlined">dentistry</span>
        <span>Dental System</span>
      </div>
      <nav class="sidebar-menu">
        <a href="panel_cliente.html"><span class="material-symbols-outlined">arrow_back</span> Regresar al Portal</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="content-header">
        <h2>Canales de Atención Directa</h2>
      </header>

      <div style="display: flex; gap: 40px; flex-wrap: wrap;">
        
        <div class="form-container" style="flex: 1; min-width: 320px;">
          <h3 style="margin-bottom: 20px;">Envíanos un Mensaje</h3>
          <form onsubmit="event.preventDefault(); alert('Mensaje enviado al área de atención.');">
            <div class="form-group">
              <label>Nombre Completo</label>
              <input type="text" required placeholder="Ej. Juan Pérez">
            </div>
            <div class="form-group">
              <label>Correo Electrónico</label>
              <input type="email" required placeholder="juan@ejemplo.com">
            </div>
            <div class="form-group">
              <label>¿En qué podemos ayudarte?</label>
              <textarea rows="4" required placeholder="Escribe tu consulta aquí..."></textarea>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">Enviar Consulta</button>
          </form>
        </div>

        <div style="flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 20px;">
          <div class="metric-card">
            <div class="metric-icon" style="background-color: #dcfce7; color: var(--success);"><span class="material-symbols-outlined">call</span></div>
            <div class="metric-data">
              <h3>WhatsApp Directo</h3>
              <p>+57 300 765 4321</p>
            </div>
          </div>
          <div class="metric-card">
            <div class="metric-icon"><span class="material-symbols-outlined">mail</span></div>
            <div class="metric-data">
              <h3>Correo de Soporte</h3>
              <p>contacto@superdental.com</p>
            </div>
          </div>
          <div class="metric-card" style="border-left: 4px solid var(--primary-color);">
            <div class="metric-icon" style="background-color: #f1f5f9; color: var(--text-main);"><span class="material-symbols-outlined">location_on</span></div>
            <div class="metric-data">
              <h3>Sede Principal</h3>
              <p>Av. Principal Calle 100 #15-30, Bogotá</p>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

</body>
</html>
